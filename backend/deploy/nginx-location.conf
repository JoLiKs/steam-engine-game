# Вставляется в server { listen 443 ... } блока 185-255-133-179.sslip.io (рядом с location / free-ai-hub).
# Префикс /steam/ срезается; бэкенд слушает 127.0.0.1:8932 и принимает запросы только с верным X-SEG-Proxy-Secret
# (исключение — публичное /api/g/* с origin из SEG_DIRECT_ORIGINS, т. е. с GitHub Pages).
location /steam/ {
    client_max_body_size 16k;
    proxy_pass http://127.0.0.1:8932/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;   # реальный IP для прямых запросов с GitHub Pages (бэкенд верит ему только с loopback)
    proxy_read_timeout 20s;
}
